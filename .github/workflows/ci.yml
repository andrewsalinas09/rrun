name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Core regression tests (mocked ssh)
        run: bash tests/core-tests.sh
      - name: Boundary-hook tests (detector + launcher)
        run: python3 tests/hook-tests.py
      - name: Source hygiene (ASCII .ps1, LF endings, no hardcoded paths)
        run: python3 tests/source-hygiene.py
  env-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # containers ssh to each other on a docker network: distro/shell/sshd
      # combinations, multi-hop chains, sabotaged deps -- see tests/matrix/
      - name: Environment matrix (docker + container-to-container ssh)
        run: bash tests/matrix/matrix.sh
  # the axes Linux containers cannot host: real PowerShell 5.1, real Windows
  # sshd, cmd.exe limits, the PowerShell-gateway exit-code pins. Runner
  # ltsc2022 matches the servercore base, so containers use process isolation.
  # REQUIRED: this half of the lane never streams, so the wedge race cannot
  # flake it -- a failure here is a real Windows-sshd regression.
  win-matrix:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Windows-container matrix lane (deterministic cells)
        shell: pwsh
        run: ./tests/matrix/matrix-win.ps1 -Mode deterministic
  # ADVISORY (continue-on-error): the streamed-large cells deliberately walk
  # into the documented nondeterministic Windows-sshd wedge race -- wedge
  # BURSTS make wall-time and flake rate unpredictable, so this stays a
  # characterization lane, not a gate. timeout-minutes is a hard backstop.
  win-matrix-stress:
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Windows-container matrix lane (streamed-wedge stress)
        shell: pwsh
        run: ./tests/matrix/matrix-win.ps1 -Mode stress
  windows-shim:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PowerShell shim local-mode tests (pwsh 7)
        shell: pwsh
        run: ./tests/shim-local-tests.ps1
      # Windows PowerShell 5.1 is the DEFAULT powershell.exe and differs in ways
      # that have shipped bugs: BOM-less .ps1 read as ANSI, and native stderr
      # raising a terminating NativeCommandError under EAP=Stop. Passing under
      # pwsh 7 proves nothing about 5.1, so run the whole suite under both.
      - name: PowerShell shim local-mode tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/shim-local-tests.ps1
      # settings.json merge/removal safety — runs against throwaway config dirs
      - name: Hook installer + remover tests (settings.json merge)
        shell: pwsh
        run: ./tests/hook-install-tests.ps1
      - name: Hook installer + remover tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/hook-install-tests.ps1
      # ownership manifest + env-restore decision table + Invoke-Native guard;
      # the Invoke-Native case only means something under 5.1, so run both
      - name: Install-state tests (pwsh 7)
        shell: pwsh
        run: ./tests/install-state-tests.ps1
      - name: Install-state tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/install-state-tests.ps1
      # Windows PowerShell 5.1 is the default powershell.exe everywhere and reads
      # BOM-less .ps1 as ANSI -- every shipped .ps1 must parse under IT, not just
      # under pwsh 7. This is the exact failure that broke a remote install.
      - name: Parse every .ps1 under Windows PowerShell 5.1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem -Path . -Filter *.ps1 -Recurse -File | ForEach-Object {
            $e = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$e)
            if ($e) { Write-Host "FAIL $($_.FullName): $($e.Count) parse error(s)"; $bad++ }
            else { Write-Host "ok   $($_.Name)" }
          }
          if ($bad) { exit 1 }
      # Windows too: the launcher must survive Git Bash + the `python3` Store
      # stub, which is exactly where naive interpreter lookup breaks.
      - name: Boundary-hook tests (detector + launcher)
        shell: bash
        run: python tests/hook-tests.py
